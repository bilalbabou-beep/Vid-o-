<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>Next Game J5</title>
<style>
@font-face{font-family:MS;src:url(fonts/montserrat-latin-500-normal.woff2);font-weight:500}
@font-face{font-family:MS;src:url(fonts/montserrat-latin-600-normal.woff2);font-weight:600}
@font-face{font-family:MS;src:url(fonts/montserrat-latin-700-normal.woff2);font-weight:700}
@font-face{font-family:MS;src:url(fonts/montserrat-latin-800-normal.woff2);font-weight:800}
:root{--yellow:#FFE600}
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:1080px;height:1920px;overflow:hidden;background:#140203}
body{font-family:MS,sans-serif;color:#fff;-webkit-font-smoothing:antialiased}
#stage{position:absolute;inset:0;overflow:hidden;background:#2a0405}
.abs{position:absolute}.full{position:absolute;inset:0}
#world{position:absolute;inset:0;transform-origin:540px 900px}

/* poster background: fond + spheres + texture (poster files) */
#base{background:radial-gradient(ellipse 760px 1100px at 50% 40%, #E3151B 0%, #C10E12 45%, #7a0a0a 75%, #2a0605 100%)}
#fond{position:absolute;left:-245px;top:0;width:1571px;height:1920px}
#bottomDark{background:linear-gradient(180deg, transparent 0%, transparent 72%, rgba(8,1,2,.7) 86%, #080102 100%)}
.sph{position:absolute}
#sphA{left:60px;top:400px;width:180px}
#sphB{left:780px;top:1080px;width:460px;filter:blur(5px)}
#sphC{left:-190px;top:1290px;width:360px;filter:blur(5px)}
#texture{position:absolute;left:-245px;top:0;width:1571px;height:1920px;mix-blend-mode:multiply;pointer-events:none}
#dark{background:#0d0102}
#dim{background:#0d0102;opacity:0}
#vignette{background:radial-gradient(ellipse 780px 1150px at 50% 46%, transparent 58%, rgba(8,0,1,.75) 100%)}
#beam{left:-700px;top:-400px;width:520px;height:3000px;background:linear-gradient(90deg, transparent, rgba(255,240,220,.15) 30%, rgba(255,255,255,.75) 50%, rgba(255,240,220,.15) 70%, transparent);filter:blur(18px);mix-blend-mode:screen}
.streak{position:absolute;height:24px;width:915px}
#fx{position:absolute;inset:0;width:1080px;height:1920px}
#flash{background:#fff;opacity:0;mix-blend-mode:screen}
#flashR{background:radial-gradient(circle at 50% 45%, rgba(255,240,200,1), rgba(255,80,60,.6) 45%, transparent 75%);opacity:0;mix-blend-mode:screen}

/* seq 1 : Ligue 1 logo + 5eme journee (poster typography) */
#l1{left:452px;top:640px;width:177px;height:192px;box-shadow:0 30px 80px rgba(0,0,0,.6),0 0 90px rgba(255,140,110,.5)}
#l1 img{width:100%;height:100%;display:block}
#j5{left:0;top:900px;width:1080px;text-align:center}
#j5 .mask{overflow:hidden;height:96px}
#j5 .jour{font:600 64px/96px MS;letter-spacing:30px;padding-left:30px;display:inline-block;color:var(--yellow)}
#j5 .jour sup{font-size:34px;letter-spacing:14px;vertical-align:top;position:relative;top:-6px}
#j5 img{display:block;margin:34px auto 0;width:610px;height:16px}

/* team : everything in poster coordinates (1080 x 1320) */
#team{position:absolute;left:0;top:0;width:1080px;height:1320px;transform-origin:0 0}
#team img{position:absolute;display:block}
#ngImg{left:332px;top:106px;width:416px;height:456px}
#legShade{position:absolute;left:-400px;top:860px;width:1880px;height:900px;background:linear-gradient(180deg, transparent 0%, rgba(14,2,3,.5) 22%, rgba(10,1,2,.85) 42%, #0a0102 62%)}
#pSph{left:71px;top:117px;width:164px;height:164px}
#pBand{left:388px;top:0;width:305px;height:8px}
#pL1{left:510px;top:0;width:59px;height:64px}
#p5{left:400px;top:72px;width:280px;height:17px}
#pDate{left:293px;top:1164px;width:145px;height:36px}
#pClubs{left:472px;top:1147px;width:137px;height:70px}
#pTime{left:640px;top:1164px;width:159px;height:36px}
.ring{position:absolute;border-radius:50%;border:6px solid rgba(255,230,180,.9);box-shadow:0 0 40px rgba(255,180,120,.9), inset 0 0 40px rgba(255,180,120,.6);opacity:0}

/* seq 3 : face to face */
.crest{position:absolute;width:270px;height:300px}
.crest img{width:100%;height:100%;object-fit:contain;filter:drop-shadow(0 24px 40px rgba(0,0,0,.6))}
#cL{left:90px;top:360px}
#cR{left:720px;top:360px}
#vLine{left:350px;top:505px;width:380px;height:11px;transform:rotate(-70deg)}
#vs{left:440px;top:440px;width:200px;text-align:center;font:800 110px/1 MS;color:var(--yellow);text-shadow:0 0 40px rgba(255,200,60,.7)}
.tname{position:absolute;top:700px;width:440px;text-align:center}
.tname span{display:block;font:800 64px/1.08 MS;color:#fff}
.tname span+span{color:var(--yellow)}
#nL{left:15px}#nR{left:625px}
#vsTag{left:0;top:890px;width:1080px;text-align:center;font:600 34px/1 MS;letter-spacing:20px;padding-left:20px;color:var(--yellow)}
#vsTag sup{font-size:20px;letter-spacing:8px;vertical-align:top;position:relative;top:-2px}

/* seq 4 : infos, poster typography */
#infoHead{left:0;top:300px;width:1080px;text-align:center}
#infoHead img{width:186px;height:204px}
#infoBand{left:235px;top:540px;width:610px;height:16px}
.row{position:absolute;left:150px;width:800px;height:200px;display:flex;align-items:center;gap:44px}
.row .ico{width:120px;height:120px;flex:0 0 120px}
.row .ico svg{width:100%;height:100%;overflow:visible}
.row .lbl{font:500 40px/1.1 MS;color:#fff;display:block}
.row .big{font:800 84px/1.05 MS;color:var(--yellow);display:block;white-space:nowrap}
.row .big small{font-size:56px;color:#fff;font-weight:600;margin-left:10px}
#r1{top:610px}#r2{top:850px}#r3{top:1090px}
#r2 .big{font-size:120px}
#r3 .big{color:#fff;font-size:76px}

/* seq 5 : slogan under the poster */
#slogan{left:0;top:1650px;width:1080px;text-align:center;font:700 40px/1 MS;color:#fff;white-space:nowrap}
#slogan b{color:var(--yellow);font-weight:800}
</style>
</head>
<body>
<div id="stage">
 <div id="world">
  <div class="full" id="base"></div>
  <img id="fond" src="../assets/poster/fond.webp">
  <img class="sph" id="sphB" src="../assets/hd/sphere.png">
  <img class="sph" id="sphC" src="../assets/hd/sphere.png">
  <img class="sph" id="sphA" src="../assets/hd/sphere.png">
  <div class="full" id="bottomDark"></div>

  <div class="full" id="players">
    <div id="team">
      <img id="pSph" src="../assets/poster/sphere.png">
      <img id="ngImg" src="../assets/poster/next-game.png">
      <img id="p1" src="../assets/poster/joueur-21-rouge.png">
      <img id="p3" src="../assets/poster/gardien-21.png">
      <img id="p4" src="../assets/poster/joueur-2-bleu.png">
      <img id="p2" src="../assets/poster/joueur-44-centre.png">
      <div id="legShade"></div>
      <img id="pBand" src="../assets/poster/bande-tricolore.png">
      <img id="pL1" src="../assets/poster/logo-ligue1-b.png">
      <img id="p5" src="../assets/poster/5eme-journee.png">
      <img id="pDate" src="../assets/poster/14-novembre.png">
      <img id="pClubs" src="../assets/poster/logos-clubs.png">
      <img id="pTime" src="../assets/poster/16h30.png">
    </div>
  </div>
  <div class="ring" id="ring1"></div>
  <div class="full" id="dim"></div>

  <div class="full" id="info">
    <div class="abs" id="infoHead"><img src="../assets/poster/next-game.png"></div>
    <img class="abs" id="infoBand" src="../assets/hd/bande-tricolore.png">
    <div class="row" id="r1">
      <div class="ico" id="icoCal"><svg viewBox="0 0 120 120" fill="none" stroke="#fff" stroke-width="7" stroke-linecap="round" stroke-linejoin="round">
        <rect x="12" y="22" width="96" height="88" rx="14"/><path d="M12 50h96"/><path d="M38 10v22M82 10v22"/>
        <g id="calPage"><text x="60" y="97" text-anchor="middle" font-family="MS" font-weight="800" font-size="40" fill="#FFE600" stroke="none">14</text></g></svg></div>
      <div><span class="lbl">SAMEDI</span><span class="big">14 NOVEMBRE</span></div>
    </div>
    <div class="row" id="r2">
      <div class="ico" id="icoClk"><svg viewBox="0 0 120 120" fill="none" stroke="#fff" stroke-width="7" stroke-linecap="round">
        <circle cx="60" cy="60" r="50"/>
        <g id="hHour"><path d="M60 60V34"/></g><g id="hMin"><path d="M60 60V20" stroke="#FFE600"/></g></svg></div>
      <div><span class="big">16H30<small>GMT</small></span></div>
    </div>
    <div class="row" id="r3">
      <div class="ico" id="icoPin"><svg viewBox="0 0 120 120" fill="none" stroke="#fff" stroke-width="7" stroke-linejoin="round">
        <ellipse id="pinShadow" cx="60" cy="112" rx="26" ry="5" fill="rgba(255,255,255,.25)" stroke="none"/>
        <g id="pinG"><path d="M60 104C44 82 24 64 24 42a36 36 0 0 1 72 0c0 22-20 40-36 62z"/><circle cx="60" cy="42" r="12" stroke="#FFE600"/></g></svg></div>
      <div><span class="big">STADE LAT DIOR</span></div>
    </div>
  </div>

  <img id="texture" src="../assets/poster/texture.webp">

  <div class="full" id="dark"></div>
  <div class="abs" id="beam"></div>
  <img class="streak" id="st1" src="../assets/hd/bande-tricolore.png" style="top:520px">
  <img class="streak" id="st2" src="../assets/hd/bande-tricolore.png" style="top:1180px">
  <img class="streak" id="st3" src="../assets/hd/bande-tricolore.png" style="top:860px">
  <div class="abs" id="l1"><img src="../assets/hd/logo-ligue1-box.png"></div>
  <div class="abs" id="j5">
    <div class="mask"><div class="jour" id="j5jour">5<sup>ÈME</sup> JOURNÉE</div></div>
    <img id="j5band" src="../assets/hd/bande-tricolore.png">
  </div>

  <img class="abs" id="vLine" src="../assets/hd/bande-tricolore.png">
  <div class="crest" id="cL"><img src="../assets/hd/logo-diambars.png"></div>
  <div class="crest" id="cR"><img src="../assets/hd/logo-mbour.png"></div>
  <div class="abs" id="vs">VS</div>
  <div class="tname" id="nL"><span>DIAMBARS</span><span>FC</span></div>
  <div class="tname" id="nR"><span>STADE DE</span><span>MBOUR</span></div>
  <div class="abs" id="vsTag">5<sup>ÈME</sup> JOURNÉE</div>

  <div class="abs" id="slogan">TOUS DERRIÈRE LE <b>STADE DE MBOUR !</b></div>

  <canvas id="fx" width="1080" height="1920"></canvas>
 </div>
 <div class="full" id="vignette"></div>
 <div class="full" id="flashR"></div>
 <div class="full" id="flash"></div>
</div>

<script src="gsap.min.js"></script>
<script>
function hash(n){ n=(n<<13)^n; return 1.0-((n*(n*n*15731+789221)+1376312589)&0x7fffffff)/1073741824.0; }
function rnd(i){ return (hash(i*7919+17)+1)/2; }

/* exact positions measured on the poster */
const BOX={p1:[145,404],p2:[314,350],p3:[507,369],p4:[720,363]};
for(const k in BOX){ const e=document.getElementById(k); e.style.left=BOX[k][0]+'px'; e.style.top=BOX[k][1]+'px'; }
function shot(px,py,s,cy){ return {x:540-px*s, y:cy-py*s, scale:s}; }
const GROUP=shot(545,760,1.12,1180);
const VSHOT=shot(545,760,0.98,1420);
const FINAL={x:540-540*1.2, y:0, scale:1.2};
const POSTER_ONLY=['#pSph','#pBand','#pL1','#p5','#pDate','#pClubs','#pTime'];

const cv=document.getElementById('fx'), cx=cv.getContext('2d');
const FX={embers:0,dust:.4,smoke:.5,sparkT:-10,sparkX:540,sparkY:780,sparks2T:-10,s2x:540,s2y:500};
const SM=[...Array(14)].map((_,i)=>({x:rnd(i)*1080,y:1250+rnd(i+50)*700,r:260+rnd(i+90)*260,v:8+rnd(i+130)*14,ph:rnd(i+170)*6.28}));
function drawFX(t){
  cx.clearRect(0,0,1080,1920);
  if(FX.smoke>0){for(const s of SM){const x=s.x+Math.sin(t*.25+s.ph)*80+t*s.v*.6,y=s.y-t*s.v;const g=cx.createRadialGradient(x,y,0,x,y,s.r);g.addColorStop(0,`rgba(255,200,190,${.09*FX.smoke})`);g.addColorStop(1,'rgba(255,200,190,0)');cx.fillStyle=g;cx.beginPath();cx.arc(x,y,s.r,0,6.283);cx.fill();}}
  if(FX.embers>0){cx.globalCompositeOperation='lighter';
    for(let i=0;i<130;i++){const sp=60+rnd(i)*170,life=1920/sp+2,ph=rnd(i+300)*life,age=(t+ph)%life;const x=rnd(i+600)*1080+Math.sin(age*1.3+i)*40,y=1960-age*sp,sz=1.5+rnd(i+900)*3.2;
      const a=FX.embers*Math.min(1,age*.8)*(0.45+0.55*rnd(i+1200));cx.fillStyle=`rgba(255,${150+Math.floor(rnd(i+1500)*90)},70,${a})`;cx.shadowColor='rgba(255,140,60,.9)';cx.shadowBlur=10;cx.beginPath();cx.arc(x,y,sz,0,6.283);cx.fill();}
    cx.shadowBlur=0;cx.globalCompositeOperation='source-over';}
  if(FX.dust>0){for(let i=0;i<90;i++){const x=(rnd(i+2000)*1180+t*(8+rnd(i+2100)*16))%1180-50,y=(rnd(i+2200)*2000-t*(4+rnd(i+2300)*10)+2000)%2000-40;cx.fillStyle=`rgba(255,235,225,${FX.dust*(.15+.35*rnd(i+2400))})`;cx.beginPath();cx.arc(x,y,.8+rnd(i+2500)*1.8,0,6.283);cx.fill();}}
  for(const [T0,X,Y,N,seed] of [[FX.sparkT,FX.sparkX,FX.sparkY,70,1],[FX.sparks2T,FX.s2x,FX.s2y,90,2]]){
    const a=t-T0; if(a<0||a>1.1) continue; cx.globalCompositeOperation='lighter';
    for(let i=0;i<N;i++){const ang=rnd(i*3+seed*1000)*6.283,v=300+rnd(i*5+seed*1000)*900,k=1-Math.exp(-a*4);const x=X+Math.cos(ang)*v*k*.45,y=Y+Math.sin(ang)*v*k*.45+a*a*220,al=Math.max(0,1-a/1.1);
      cx.strokeStyle=`rgba(255,${200+Math.floor(rnd(i)*55)},120,${al})`;cx.lineWidth=2.5;const vx=Math.cos(ang)*v*Math.exp(-a*4)*.03,vy=Math.sin(ang)*v*Math.exp(-a*4)*.03;cx.beginPath();cx.moveTo(x,y);cx.lineTo(x-vx*3,y-vy*3);cx.stroke();}
    cx.globalCompositeOperation='source-over';}
}

const tl=gsap.timeline({paused:true});
const E={in:'expo.out',out:'expo.in',io:'power3.inOut',back:'back.out(1.6)'};

gsap.set(['#info','#cL','#cR','#vs','#nL','#nR','#vsTag','#vLine','#slogan','#l1','#j5','#players'],{autoAlpha:0});
gsap.set(['#p1','#p2','#p3','#p4','#ngImg',...POSTER_ONLY],{autoAlpha:0});
gsap.set('#dark',{opacity:.86});
gsap.set('.streak',{x:-1000,opacity:0});
gsap.set('#beam',{rotation:28});
gsap.set('#team',shot(246,620,1.75,1010));

/* background always alive */
tl.fromTo('#fond',{x:0,y:0,scale:1.0},{x:-40,y:-30,scale:1.06,duration:30,ease:'none'},0);
tl.fromTo('#sphA',{x:0,y:0,rotation:0},{x:60,y:-140,rotation:40,duration:30,ease:'none'},0);
tl.fromTo('#sphB',{x:0,y:0,rotation:0},{x:-70,y:-120,rotation:-30,duration:30,ease:'none'},0);
tl.fromTo('#sphC',{x:0,y:0},{x:50,y:-90,duration:30,ease:'none'},0);
tl.fromTo('#world',{scale:1.0},{scale:1.04,duration:4,ease:'none'},0);

/* SEQ 1 : 0-4 */
tl.to(FX,{dust:.9,smoke:.8,duration:2},0);
tl.to('#dark',{opacity:.72,duration:1.2,ease:'none'},0);
[['#st1',0.30,1],['#st2',0.55,-1],['#st3',0.85,1]].forEach(([s,t,d])=>{
  tl.fromTo(s,{x:d>0?-1100:1200,opacity:1},{x:d>0?1200:-1100,duration:.5,ease:'power2.in',immediateRender:false},t);});
tl.fromTo('#beam',{x:-200},{x:1900,duration:1.1,ease:'power2.inOut'},0.85);
tl.fromTo('#l1',{autoAlpha:0,scale:1.6,filter:'blur(16px)'},{autoAlpha:1,scale:1,filter:'blur(0px)',duration:.45,ease:E.in},1.2);
tl.to('#flashR',{opacity:.55,duration:.06},1.2).to('#flashR',{opacity:0,duration:.5},1.26);
tl.to('#l1',{scale:1.05,duration:1.0,ease:'none'},1.65);
tl.to('#l1',{y:-60,duration:.5,ease:E.in},2.25);
tl.set('#j5',{autoAlpha:1},2.25);
tl.fromTo('#j5jour',{yPercent:110},{yPercent:0,duration:.42,ease:E.in},2.3);
tl.fromTo('#j5jour',{letterSpacing:'60px'},{letterSpacing:'30px',duration:1.2,ease:E.in},2.3);
tl.to('#flash',{opacity:.55,duration:.04},2.3).to('#flash',{opacity:0,duration:.35},2.34);
tl.to('#dark',{opacity:.45,duration:.4},2.3);
tl.fromTo('#j5band',{scaleX:0,opacity:0},{scaleX:1,opacity:1,duration:.45,ease:E.in},2.7);
tl.fromTo('#j5',{scale:1},{scale:1.05,duration:1.3,ease:'none'},2.4);
tl.to(FX,{embers:.6,duration:1},2.3);
tl.to(['#j5','#l1'],{scale:2.4,filter:'blur(16px)',autoAlpha:0,duration:.32,ease:E.out},3.68);
tl.to('#dark',{opacity:0,duration:.3,ease:E.out},3.7);

/* SEQ 2 : 4-11 the camera meets each player */
tl.to('#flash',{opacity:.75,duration:.05},3.98).to('#flash',{opacity:0,duration:.45},4.03);
tl.set('#players',{autoAlpha:1},4.0);
tl.fromTo('#world',{scale:1.0},{scale:1.04,duration:7,ease:'none'},4.0);
tl.to(FX,{embers:1,duration:1},4);
const STOPS=[['#p1',4.2,shot(246,620,1.75,1010),shot(246,620,1.85,1010)],
             ['#p4',5.2,shot(832,620,1.75,1010),shot(832,620,1.85,1010)],
             ['#p3',6.2,shot(645,600,1.75,1010),shot(645,600,1.85,1010)],
             ['#p2',7.2,shot(447,580,1.85,980),shot(447,580,2.0,980)]];
STOPS.forEach(([p,t,a,b],i)=>{
  if(i>0){ tl.to('#team',{...a,duration:.3,ease:E.io},t-.32);
           tl.to('#team',{filter:'blur(10px)',duration:.15,ease:'power2.in'},t-.32).to('#team',{filter:'blur(0px)',duration:.15,ease:'power2.out'},t-.17); }
  tl.to('#team',{...b,duration:.78,ease:'none'},t-.02);
  const big=p==='#p2';
  tl.fromTo(p,{autoAlpha:0,y:big?60:30,filter:'blur(14px) brightness(2.2)'},{autoAlpha:1,y:0,filter:'blur(0px) brightness(1)',duration:big?.6:.5,ease:E.in},t);
  tl.to('#flashR',{opacity:big?.85:.45,duration:.05},t).to('#flashR',{opacity:0,duration:big?.6:.4},t+.05);
});
tl.set(FX,{sparkT:7.2,sparkX:540,sparkY:900},7.1);
tl.fromTo('#ring1',{left:290,top:600,width:500,height:500,opacity:.9,scale:.6},{scale:2.4,opacity:0,duration:.9,ease:E.in,immediateRender:false},7.2);
tl.to('#flash',{opacity:.5,duration:.04},7.2).to('#flash',{opacity:0,duration:.4},7.24);
tl.to('#team',{...GROUP,duration:.6,ease:'expo.inOut'},8.0);
tl.to('#team',{...shot(545,760,1.16,1180),duration:2.15,ease:'none'},8.6);
tl.set('#ngImg',{autoAlpha:1},8.3);
tl.fromTo('#ngImg',{clipPath:'inset(100% 0 0 0)',y:60},{clipPath:'inset(0% 0 0 0)',y:0,duration:.55,ease:E.in},8.3);
tl.to('#flashR',{opacity:.5,duration:.05},8.45).to('#flashR',{opacity:0,duration:.4},8.5);
tl.to('#ngImg',{autoAlpha:0,filter:'blur(12px)',duration:.3,ease:E.out},10.72);
tl.to('#team',{...VSHOT,filter:'blur(4px) brightness(.5)',duration:.55,ease:E.io},10.75);

/* SEQ 3 : 11-18 face to face, the tricolour band is the light line */
tl.set('#vLine',{autoAlpha:1},10.98);
tl.fromTo('#vLine',{scaleX:0},{scaleX:1,duration:.22,ease:'power2.in'},10.98);
tl.to('#flash',{opacity:.85,duration:.04},11.12).to('#flash',{opacity:0,duration:.4},11.16);
tl.to('#dim',{opacity:.35,duration:.5},11.1);
tl.fromTo('#world',{scale:1.06},{scale:1.0,duration:.5,ease:E.in},11.1);
tl.to('#world',{scale:1.04,duration:6.4,ease:'none'},11.6);
tl.fromTo('#cL',{autoAlpha:0,x:-520,rotation:-14,filter:'blur(14px)'},{autoAlpha:1,x:0,rotation:0,filter:'blur(0px)',duration:.5,ease:E.in},11.35);
