<style>

/* seq 4 */

<script src="gsap.min.js"></script>
<script>
function hash(n){ n=(n<<13)^n; return 1.0-((n*(n*n*15731+789221)+1376312589)&0x7fffffff)/1073741824.0; }
function rnd(i){ return (hash(i*7919+17)+1)/2; }
/* music grid: 136 BPM, first beat at 0.60 s  */
const BEAT=0.4456, T0=0.60; const K=k=>T0+k*BEAT;
function shot(px,py,s,cy){ return {x:540-px*s, y:cy-py*s, scale:s}; }
const GROUP=shot(600,700,1.12,1150);
const VSHOT=shot(600,700,0.95,1480);
const FINAL={x:540-540*1.05, y:0, scale:1.05};
const POSTER_ONLY=['#pBand','#pL1','#p6','#pInfo'];

const cv=document.getElementById('fx'), cx=cv.getContext('2d');
const FX={embers:0,dust:.5,sparkT:-10,sparkX:540,sparkY:780,sparks2T:-10,s2x:540,s2y:500};
function drawFX(t){
  cx.clearRect(0,0,1080,1920);
  if(FX.embers>0){cx.globalCompositeOperation='lighter';
    for(let i=0;i<110;i++){const sp=50+rnd(i)*150,life=1920/sp+2,ph=rnd(i+300)*life,age=(t+ph)%life;const x=rnd(i+600)*1080+Math.sin(age*1.3+i)*40,y=1960-age*sp,sz=1.4+rnd(i+900)*3;
      const a=FX.embers*Math.min(1,age*.8)*(0.4+0.5*rnd(i+1200));cx.fillStyle=`rgba(255,${170+Math.floor(rnd(i+1500)*70)},90,${a})`;cx.shadowColor='rgba(255,170,80,.9)';cx.shadowBlur=10;cx.beginPath();cx.arc(x,y,sz,0,6.283);cx.fill();}
    cx.shadowBlur=0;cx.globalCompositeOperation='source-over';}
  if(FX.dust>0){for(let i=0;i<90;i++){const x=(rnd(i+2000)*1180+t*(10+rnd(i+2100)*18))%1180-50,y=(rnd(i+2200)*2000-t*(4+rnd(i+2300)*10)+2000)%2000-40;cx.fillStyle=`rgba(255,240,215,${FX.dust*(.15+.35*rnd(i+2400))})`;cx.beginPath();cx.arc(x,y,.8+rnd(i+2500)*1.8,0,6.283);cx.fill();}}
  for(const [T,X,Y,N,seed] of [[FX.sparkT,FX.sparkX,FX.sparkY,70,1],[FX.sparks2T,FX.s2x,FX.s2y,90,2]]){
    const a=t-T; if(a<0||a>1.1) continue; cx.globalCompositeOperation='lighter';
    for(let i=0;i<N;i++){const ang=rnd(i*3+seed*1000)*6.283,v=300+rnd(i*5+seed*1000)*900,k=1-Math.exp(-a*4);const x=X+Math.cos(ang)*v*k*.45,y=Y+Math.sin(ang)*v*k*.45+a*a*220,al=Math.max(0,1-a/1.1);
      cx.strokeStyle=`rgba(255,${210+Math.floor(rnd(i)*45)},140,${al})`;cx.lineWidth=2.5;const vx=Math.cos(ang)*v*Math.exp(-a*4)*.03,vy=Math.sin(ang)*v*Math.exp(-a*4)*.03;cx.beginPath();cx.moveTo(x,y);cx.lineTo(x-vx*3,y-vy*3);cx.stroke();}
    cx.globalCompositeOperation='source-over';}
}

const tl=gsap.timeline({paused:true});
const E={in:'expo.out',out:'expo.in',io:'power3.inOut',back:'back.out(1.6)'};
const flash=(t,o=.6,d=.4,s='#flash')=>tl.to(s,{opacity:o,duration:.04},t).to(s,{opacity:0,duration:d},t+.04);

gsap.set(['#info','#cL','#cR','#vs','#nL','#nR','#vsTag','#vLine','#slogan','#l1','#j6'],{autoAlpha:0});
gsap.set(['#pL','#pR','#nextUp','.bird',...POSTER_ONLY],{autoAlpha:0});
gsap.set('#dark',{opacity:.8});
gsap.set('#dim',{opacity:1});
gsap.set('.pl8',{filter:'blur(14px)'});
gsap.set('.streak',{x:-1000,opacity:0});
gsap.set('#beam',{rotation:28});
gsap.set('#team',shot(600,560,1.25,900));

/* always alive: sun breathes, camera drifts, birds glide */
tl.fromTo('#sun',{scale:.96,opacity:.7},{scale:1.04,opacity:1,duration:30,ease:'none'},0);
tl.fromTo('#world',{scale:1.0},{scale:1.04,duration:K(8),ease:'none'},0);
tl.to('#team',{...shot(600,560,1.32,900),duration:K(8),ease:'none'},0);

/* SEQ 1 : the announcement (beats 0-8) */
tl.to('#dark',{opacity:.55,duration:1.2,ease:'none'},0);
[['#st1',K(0),1],['#st2',K(1),-1],['#st3',K(1.5),1]].forEach(([s,t,d])=>{
  tl.fromTo(s,{x:d>0?-1100:1200,opacity:1},{x:d>0?1200:-1100,duration:.5,ease:'power2.in',immediateRender:false},t-.25);});
tl.fromTo('#beam',{x:-200},{x:1900,duration:1.1,ease:'power2.inOut'},K(0.5));
tl.fromTo('#l1',{autoAlpha:0,scale:1.6,filter:'blur(16px)'},{autoAlpha:1,scale:1,filter:'blur(0px)',duration:.4,ease:E.in},K(2));
flash(K(2),.55,.5,'#flashR');
tl.to('#l1',{scale:1.05,duration:.9,ease:'none'},K(2)+.4);
tl.to('#l1',{y:-60,duration:.45,ease:E.in},K(4));
tl.set('#j6',{autoAlpha:1},K(4));
tl.fromTo('#j6jour',{yPercent:110},{yPercent:0,duration:.4,ease:E.in},K(4));
tl.fromTo('#j6jour',{letterSpacing:'60px'},{letterSpacing:'30px',duration:1.2,ease:E.in},K(4));
flash(K(4),.5,.35);
tl.fromTo('#j6band',{scaleX:0,opacity:0},{scaleX:1,opacity:1,duration:.4,ease:E.in},K(5));
tl.fromTo('#j6',{scale:1},{scale:1.05,duration:1.4,ease:'none'},K(4));
tl.to(FX,{embers:.5,duration:1},K(4));
tl.to(['#j6','#l1'],{scale:2.4,filter:'blur(16px)',autoAlpha:0,duration:.3,ease:E.out},K(8)-.3);
tl.to('#dark',{opacity:0,duration:.3,ease:E.out},K(8)-.3);

/* SEQ 2 : the players (beats 8-24) */
flash(K(8),.75,.45);
tl.to('#dim',{opacity:0,duration:.25},K(8));
tl.to('.pl8',{filter:'blur(0px)',duration:.3},K(8));
tl.set('.bird',{autoAlpha:1},K(8));
tl.fromTo('#bd1',{x:-160,y:30},{x:60,y:-25,duration:30-K(8),ease:'none'},K(8));
tl.fromTo('#bd2',{x:-120,y:40},{x:90,y:-30,duration:30-K(8),ease:'none'},K(8));
tl.fromTo('#bd3',{x:-140,y:20},{x:70,y:-20,duration:30-K(8),ease:'none'},K(8));
tl.fromTo('#world',{scale:1.0},{scale:1.03,duration:K(24)-K(8),ease:'none'},K(8));
tl.to(FX,{embers:.8,duration:1},K(8));
tl.fromTo('#team',shot(775,500,1.55,930),{...shot(775,500,1.65,930),duration:K(12)-K(8)-.32,ease:'none',immediateRender:false},K(8));
tl.fromTo('#pR',{autoAlpha:0,y:30,filter:'blur(14px) brightness(1.8)'},{autoAlpha:1,y:0,filter:'blur(0px) brightness(1)',duration:.5,ease:E.in},K(8));
flash(K(8)+.02,.45,.4,'#flashR');
tl.to('#team',{...shot(545,540,1.6,930),duration:.3,ease:E.io},K(12)-.32);
tl.to('#team',{filter:'blur(10px)',duration:.15,ease:'power2.in'},K(12)-.32).to('#team',{filter:'blur(0px)',duration:.15,ease:'power2.out'},K(12)-.17);
tl.to('#team',{...shot(545,540,1.75,930),duration:K(15.5)-K(12),ease:'none'},K(12)-.02);
tl.fromTo('#pL',{autoAlpha:0,y:60,filter:'blur(14px) brightness(1.8)'},{autoAlpha:1,y:0,filter:'blur(0px) brightness(1)',duration:.6,ease:E.in},K(12));
flash(K(12),.85,.6,'#flashR');
tl.set(FX,{sparkT:K(12),sparkX:540,sparkY:780},K(12)-.1);
tl.fromTo('#ring1',{left:290,top:450,width:500,height:500,opacity:.9,scale:.6},{scale:2.4,opacity:0,duration:.9,ease:E.in,immediateRender:false},K(12));
/* pull back + NEXT UP sphere */

/* dynamism layer: beat pulse, handheld shake, bar streaks and flashes (pure function of t) */
const PU=document.getElementById('pulse'), D1=document.getElementById('dy1'), D2=document.getElementById('dy2'), FR=document.getElementById('flashB');
const HITS=[K(8),K(12),K(16),K(24),K(25),K(40),K(56),K(64)];
function dyn(t){
  const kb=(t-T0)/BEAT, k=Math.floor(kb), ph=(kb-k)*BEAT;
  let s=1, r=0;
  if(kb>=0){ const down=(k%4===0); s+= (down?.028:.012)*Math.exp(-ph*9); if(down) r=(k%8===0?1:-1)*.5*Math.exp(-ph*7); }
  for(const h of HITS){ const a=t-h; if(a>=0&&a<.5) s+=.06*Math.exp(-a*10); }
  const sx=Math.sin(t*7.1)*2.2+Math.sin(t*12.7)*1.3, sy=Math.cos(t*6.3)*2+Math.sin(t*10.9)*1.2;
  PU.style.transform=`translate(${sx.toFixed(2)}px,${sy.toFixed(2)}px) rotate(${r.toFixed(3)}deg) scale(${s.toFixed(4)})`;
  /* streaks on every bar after the intro */
  const bar=Math.floor(kb/4), bp=(kb-bar*4)*BEAT;
  const on=t>K(8) && !(t>K(55.5)&&t<K(56.4)) && t<K(64)+.3;
  [[D1,0],[D2,1]].forEach(([el,j])=>{
    const p=(bp-j*.12)/.32;
    if(!on||p<0||p>1){ el.style.opacity=0; return; }
    const dir=((bar+j)%2)?1:-1, y=[1180,1320,235,1460,1250][(bar*3+j*2)%5], x=dir>0?-950+p*2200:1100-p*2200;
    el.style.opacity=(Math.sin(Math.PI*p)*.85).toFixed(3);
    el.style.transform=`translate(${x.toFixed(1)}px,${y}px) rotate(${dir*-8}deg)`;
  });
}
window.seek=function(t){tl.seek(t,false);drawFX(t);dyn(t);
  const kb=(t-T0)/BEAT, k=Math.floor(kb), ph=(kb-k)*BEAT;
  FR.style.opacity=(t>K(8)&&k%4===0&&ph<.3)?(.22*Math.exp(-ph*12)).toFixed(3):0;
};
window.__ready=(async()=>{await document.fonts.ready;await Promise.all([...document.images].map(i=>i.complete?1:new Promise(r=>{i.onload=i.onerror=r;})));await document.fonts.load('800 50px MS');await document.fonts.load('600 50px MS');await document.fonts.load('500 50px MS');await document.fonts.load('800 50px BC');window.seek(0);return true;})();
